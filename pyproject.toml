[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flypaper"
version = "0.1.0"
description = "Sticky clipboard memory for prompts, CLI, snippets, secrets, and files"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "W. Allen Satz" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
flypaper = "flypaper.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
flypaper = ["../site/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
